name: Build and publish container image

on:
  push:
    branches: [ main ]
    tags: [ 'aviation-message-archiver-[0-9]*' ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Resolve Maven artifact metadata
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ARTIFACT_ID=$(./mvnw -B -q -DforceStdout -Dexpression=project.artifactId help:evaluate)
          echo "ARTIFACT_ID=${ARTIFACT_ID}" >> "$GITHUB_ENV"

          # Extract version from tag
          PREFIX="${ARTIFACT_ID}-"
          if [[ "$REF_NAME" == "${PREFIX}"* ]]; then
            VERSION="${REF_NAME#"$PREFIX"}"
            echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

            # Compute major.minor and major aliases for stable releases only
            if [[ "$VERSION" != *-* && "$VERSION" != *+* ]]; then
              MAJOR="${VERSION%%.*}"
              REST="${VERSION#*.}"
              MINOR_PART="${REST%%.*}"
              MINOR="${MAJOR}.${MINOR_PART}"
              echo "RELEASE_MINOR=${MINOR}" >> "$GITHUB_ENV"
              if [[ "$MAJOR" != "0" ]]; then
                echo "RELEASE_MAJOR=${MAJOR}" >> "$GITHUB_ENV"
              fi
            fi
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name
            type=ref,event=branch
            # Tag stable releases with 'latest'
            type=raw,value=latest,enable=${{ env.RELEASE_MINOR != '' }}
            # Tag with semantic version
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=${{ env.RELEASE_MINOR }},enable=${{ env.RELEASE_MINOR != '' }}
            type=raw,value=${{ env.RELEASE_MAJOR }},enable=${{ env.RELEASE_MAJOR != '' }}
            # Tag with short SHA
            type=sha,prefix=

      - name: Build container image
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          mkdir -p ~/.m2/repository ~/.m2/wrapper

          declare -a BUILD_OPTS=( \
            --file ./Containerfile \
            --pull=newer \
            --omit-history \
            --volume ~/.m2/repository:/root/.m2/repository:z \
            --volume ~/.m2/wrapper:/root/.m2/wrapper:z \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build" \
          )
          while IFS= read -r label; do
            [ -n "$label" ] && BUILD_OPTS+=( --label "$label" )
          done <<< "$LABELS"

          podman build "${BUILD_OPTS[@]}" .

      - name: Tag and push container image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            podman tag "${IMAGE}:build" "${tag}"
            podman push "${tag}"
          done <<< "$TAGS"
